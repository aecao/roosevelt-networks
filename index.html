<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roosevelt Networks</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>Roosevelt Networks</h1>
      <p class="subtitle">Actor network model</p>

      <div class="panel">
        <input id="search" type="search" placeholder="Search actor…" autocomplete="off" />
        <div id="search-results" class="search-results"></div>
      </div>

      <div class="panel">
        <h2>Adjacency type</h2>
        <div id="edge-type-filters" class="filter-list"></div>
      </div>

      <div class="panel">
        <h2>Actor category</h2>
        <div id="node-type-filters" class="filter-list"></div>
      </div>

      <div class="panel">
        <h2>Topic</h2>
        <div id="topic-filters" class="filter-list"></div>
      </div>

      <div class="panel">
        <h2>Scale</h2>
        <div id="scale-filters" class="filter-list"></div>
      </div>

      <div class="panel">
        <h2>Time</h2>
        <label class="toggle-row">
          <input id="year-filter-toggle" type="checkbox" />
          <span>Filter by active year</span>
        </label>
        <div id="year-controls" class="year-controls" hidden>
          <label for="year-slider">Year <output id="year-value">2026</output></label>
          <input id="year-slider" type="range" min="1920" max="2026" step="1" value="2026" />
        </div>
      </div>

      <div class="panel">
        <button id="reset-view">Reset view</button>
        <label class="toggle-row">
          <input id="freeze-positions" type="checkbox" />
          <span>Freeze actor position</span>
        </label>
      </div>

      <div id="node-details" class="panel details hidden"></div>
    </aside>
    <main id="graph-container"></main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
