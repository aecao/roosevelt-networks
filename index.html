<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roosevelt Networks</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header id="app-header">
      <div class="header-brand-group">
        <div class="app-brand">Roosevelt Networks</div>
        <span id="refresh-status" class="refresh-status visually-hidden" role="status" aria-live="polite" hidden></span>
      </div>
      <div class="mode-switch">
        <span class="mode-label">MODE</span>
        <nav class="mode-tabs" aria-label="Network mode">
          <button class="mode-tab" type="button" data-mode="relationships" aria-pressed="true">Relationships</button>
          <button class="mode-tab" type="button" data-mode="map" aria-pressed="false">Map</button>
          <button class="mode-tab" type="button" data-mode="timeline" aria-pressed="false">Timeline</button>
        </nav>
      </div>
      <button id="refresh-sheets" class="header-refresh" type="button" title="Relink data from Google Sheets">
        <span aria-hidden="true">↻</span><span>Relink data</span>
      </button>
    </header>
    <div id="refresh-progress" class="refresh-progress-overlay" role="progressbar" aria-label="Relinking data" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
      <div class="refresh-progress-track">
        <div id="refresh-progress-bar" class="refresh-progress-bar"></div>
      </div>
      <span class="refresh-progress-label">Relinking…</span>
    </div>
    <div id="workspace" data-mode="relationships">
      <div id="panel-dock" data-panel="filters">
        <nav id="panel-tabs" aria-label="Sidebar panel">
          <button class="panel-tab" type="button" data-panel="filters" aria-pressed="true">Filters</button>
          <button class="panel-tab" type="button" data-panel="details" aria-pressed="false">Details</button>
        </nav>
      <aside id="sidebar">
      <header class="sidebar-header">
        <div class="sidebar-heading">
          <h1>Filters</h1>
        </div>
        <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Hide filters" aria-expanded="true" aria-controls="sidebar-content">−</button>
      </header>

      <div id="sidebar-content">
        <div id="sidebar-search" class="panel">
          <input id="search" type="search" placeholder="Search actor…" autocomplete="off" />
          <div id="search-results" class="search-results"></div>
        </div>

        <div id="sidebar-filters-scroll">
          <section class="filter-section">
            <h2>ACTORS</h2>

            <div class="panel">
              <div class="filter-heading">
                <button class="filter-group-toggle" type="button" aria-expanded="false" aria-controls="node-type-group">
                  <span class="filter-group-chevron">▸</span><span>SECTOR</span>
                </button>
              </div>
              <div id="node-type-group" class="filter-group-content" hidden>
                <label class="filter-all"><input id="node-type-select-all" type="checkbox" checked /><span>All</span></label>
                <div id="node-type-filters" class="filter-list"></div>
              </div>
            </div>

            <div class="panel">
              <div class="filter-heading">
                <button class="filter-group-toggle" type="button" aria-expanded="false" aria-controls="topic-group">
                  <span class="filter-group-chevron">▸</span><span>CATEGORY</span>
                </button>
              </div>
              <div id="topic-group" class="filter-group-content" hidden>
                <label class="filter-all"><input id="topic-select-all" type="checkbox" checked /><span>All</span></label>
                <div id="topic-filters" class="filter-list"></div>
              </div>
            </div>

            <div class="panel">
              <div class="filter-heading">
                <button class="filter-group-toggle" type="button" aria-expanded="false" aria-controls="scale-group">
                  <span class="filter-group-chevron">▸</span><span>SCALE</span>
                </button>
              </div>
              <div id="scale-group" class="filter-group-content" hidden>
                <label class="filter-all"><input id="scale-select-all" type="checkbox" checked /><span>All</span></label>
                <div id="scale-filters" class="filter-list"></div>
                <label class="filter-all"><input id="size-nodes-by-scale" type="checkbox" checked /><span>Size nodes by scale</span></label>
              </div>
            </div>

            <div class="panel relationships-only">
              <div class="filter-heading">
                <button class="filter-group-toggle" type="button" aria-expanded="false" aria-controls="appearance-group">
                  <span class="filter-group-chevron">▸</span><span>APPEARANCE</span>
                </button>
              </div>
              <div id="appearance-group" class="filter-group-content" hidden>
                <div class="appearance-controls">
                  <label class="toggle-row">
                    <input id="labels-toggle" type="checkbox" checked />
                    <span>Labels</span>
                  </label>
                  <label for="text-size-slider">Text size <output id="text-size-value">100%</output></label>
                  <input id="text-size-slider" type="range" min="50" max="150" step="1" value="100" />
                  <label for="text-threshold-slider">Label threshold <output id="text-threshold-value">125%</output></label>
                  <input id="text-threshold-slider" type="range" min="50" max="300" step="1" value="125" />
                  <label for="node-size-slider">Node size <output id="node-size-value">50</output></label>
                  <div class="slider-with-steps">
                    <button id="node-size-decrement" class="slider-step-button" type="button" aria-label="Decrease node size">−</button>
                    <input id="node-size-slider" type="range" min="1" max="100" step="1" value="50" list="node-size-ticks" />
                    <button id="node-size-increment" class="slider-step-button" type="button" aria-label="Increase node size">+</button>
                  </div>
                  <datalist id="node-size-ticks">
                    <option value="1"></option>
                    <option value="25"></option>
                    <option value="50"></option>
                    <option value="75"></option>
                    <option value="100"></option>
                  </datalist>
                  <label for="color-mode">COLOR MODE</label>
                  <select id="color-mode">
                    <option value="sector">Sector</option>
                    <option value="category">Category</option>
                    <option value="public-sentiment">Public sentiment</option>
                    <option value="plain">Plain</option>
                  </select>
                  <label for="size-mode">HALO TYPE</label>
                  <select id="size-mode">
                    <option value="public-interest">Public interest</option>
                    <option value="degree-centrality">Number of connections (degree centrality)</option>
                    <option value="closeness-centrality">Average shortest-path (closeness centrality)</option>
                    <option value="betweenness-centrality">Bridging (betweenness centrality)</option>
                    <option value="eigenvector-centrality">Prestige (eigenvector centrality)</option>
                    <option value="plain">Plain</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="panel relationships-only">
              <div class="filter-heading">
                <button class="filter-group-toggle" type="button" aria-expanded="true" aria-controls="centrality-group">
                  <span class="filter-group-chevron">▾</span><span>CENTRALITY</span>
                </button>
              </div>
              <div id="centrality-group" class="filter-group-content">
                <div class="appearance-controls">
                  <label for="centrality-type">CENTRALITY TYPE</label>
                  <select id="centrality-type">
                    <option value="degree-centrality">Degree centrality</option>
                    <option value="closeness-centrality">Closeness centrality</option>
                    <option value="betweenness-centrality">Betweenness centrality</option>
                    <option value="eigenvector-centrality">Eigenvector centrality</option>
                  </select>
                  <label for="centrality-threshold-slider">Minimum number of connections <output id="centrality-threshold-value">0</output></label>
                  <div class="slider-with-steps">
                    <button id="centrality-threshold-decrement" class="slider-step-button" type="button" aria-label="Decrease minimum connections">−</button>
                    <input id="centrality-threshold-slider" type="range" min="0" max="1" step="1" value="0" list="centrality-threshold-ticks" />
                    <button id="centrality-threshold-increment" class="slider-step-button" type="button" aria-label="Increase minimum connections">+</button>
                  </div>
                  <datalist id="centrality-threshold-ticks"></datalist>
                </div>
              </div>
            </div>
          </section>

          <section class="filter-section timeline-only">
            <h2>YEAR RANGE</h2>
            <div class="panel timeline-range-fields">
              <label for="timeline-start">From
                <input id="timeline-start" type="number" min="1920" max="2025" step="1" value="1920" />
              </label>
              <label for="timeline-end">To
                <input id="timeline-end" type="number" min="1921" max="2026" step="1" value="2026" />
              </label>
            </div>
          </section>

          <section class="filter-section relationships-only">
            <h2>RELATIONSHIPS</h2>
            <div class="panel">
              <label class="filter-all"><input id="edge-type-select-all" type="checkbox" checked /><span>All</span></label>
              <div id="edge-type-filters" class="filter-list"></div>
              <div class="edge-curvature-control">
                <label for="edge-curvature-slider">Connection curvature <output id="edge-curvature-value">20%</output></label>
                <div class="slider-with-steps">
                  <button id="edge-curvature-decrement" class="slider-step-button" type="button" aria-label="Decrease connection curvature">−</button>
                  <input id="edge-curvature-slider" type="range" min="0" max="100" step="1" value="20" list="edge-curvature-ticks" />
                  <button id="edge-curvature-increment" class="slider-step-button" type="button" aria-label="Increase connection curvature">+</button>
                </div>
                <datalist id="edge-curvature-ticks">
                  <option value="0"></option>
                  <option value="10"></option>
                  <option value="20"></option>
                  <option value="30"></option>
                  <option value="40"></option>
                  <option value="50"></option>
                  <option value="60"></option>
                  <option value="70"></option>
                  <option value="80"></option>
                  <option value="90"></option>
                  <option value="100"></option>
                </datalist>
              </div>
              <div class="edge-curvature-control">
                <label for="layout-gravity-slider">Gravity <output id="layout-gravity-value">20</output></label>
                <div class="slider-with-steps">
                  <button id="layout-gravity-decrement" class="slider-step-button" type="button" aria-label="Decrease gravity">−</button>
                  <input id="layout-gravity-slider" type="range" min="0" max="25" step="1" value="20" list="layout-gravity-ticks" />
                  <button id="layout-gravity-increment" class="slider-step-button" type="button" aria-label="Increase gravity">+</button>
                </div>
                <datalist id="layout-gravity-ticks">
                  <option value="0"></option>
                  <option value="5"></option>
                  <option value="10"></option>
                  <option value="15"></option>
                  <option value="20"></option>
                  <option value="25"></option>
                </datalist>
              </div>
            </div>
          </section>

          <section class="filter-section relationships-only">
            <h2>TIME RANGE</h2>
            <div class="panel">
              <label class="toggle-row">
                <input id="year-filter-toggle" type="checkbox" />
                <span>Filter by active year</span>
              </label>
              <div id="year-controls" class="year-controls" hidden>
                <label for="year-slider">Year <output id="year-value">2026</output></label>
                <div class="slider-with-steps">
                  <button id="year-decrement" class="slider-step-button" type="button" aria-label="Decrease year by 5">−</button>
                  <input id="year-slider" type="range" min="1920" max="2026" step="1" value="2026" />
                  <button id="year-increment" class="slider-step-button" type="button" aria-label="Increase year by 5">+</button>
                </div>
              </div>
            </div>
          </section>
        </div>

        <div id="sidebar-footer" class="panel relationships-only">
          <label class="toggle-row">
            <input id="freeze-positions" type="checkbox" />
            <span>Freeze actor position</span>
          </label>
          <label class="toggle-row">
            <input id="zoom-to-selected" type="checkbox" checked />
            <span>Zoom to selected</span>
          </label>
        </div>
      </div>
      </aside>
        <aside id="details-sidebar" class="collapsed" aria-label="Details">
          <div id="details-resize-handle" aria-hidden="true"></div>
          <header class="sidebar-header">
            <div class="sidebar-heading">
              <h1>Details</h1>
            </div>
            <button id="details-toggle" class="sidebar-toggle" type="button" aria-label="Show details" aria-expanded="false">+</button>
          </header>
          <div id="details-content">
            <section id="active-selection" class="selection-section">
              <p id="no-selection-message" class="no-selection-message">No active selection</p>
              <header class="selection-heading" hidden>
                <h2 id="current-selection-title"></h2>
                <button id="pin-selection" class="pin-selection" type="button">Pin</button>
              </header>
              <div id="node-details" class="details" hidden></div>
            </section>
            <section id="pinned-section" class="pinned-section" aria-label="Pinned selections" hidden>
              <header class="pinned-section-heading">
                <h2>Pinned selections</h2>
                <span id="pinned-count">0</span>
              </header>
              <ol id="pinned-list" class="pinned-list"></ol>
            </section>
          </div>
        </aside>
      </div>
      <main id="graph-container">
        <section id="timeline-view" aria-label="Actor timeline" aria-hidden="true">
          <svg id="timeline-axis" aria-hidden="true"></svg>
          <div id="timeline-scroll">
            <svg id="timeline-chart" role="img" aria-label="Actor periods of existence"></svg>
          </div>
          <div id="timeline-summary" aria-live="polite"></div>
        </section>
        <div id="map-caption" class="map-caption" hidden aria-live="polite">
          <span>ROOSEVELT ISLAND</span>
        </div>
      </main>
    </div>
  </div>
  <div id="selection-context-menu" class="selection-context-menu" role="menu" hidden>
    <button id="context-pin-toggle" type="button" role="menuitem">Pin selection</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
