name: Deploy alias to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build redirect page
        run: |
          mkdir -p redirect-dist
          cat > redirect-dist/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta http-equiv="refresh" content="0; url=https://imadeitfor.you/app/roosevelt-networks/" />
            <link rel="canonical" href="https://imadeitfor.you/app/roosevelt-networks/" />
            <title>Roosevelt Networks has moved</title>
            <script>location.replace("https://imadeitfor.you/app/roosevelt-networks/");</script>
          </head>
          <body>
            <p>This page has moved to <a href="https://imadeitfor.you/app/roosevelt-networks/">imadeitfor.you/app/roosevelt-networks</a>.</p>
          </body>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
